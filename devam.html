<script>

function devamEt() {

    /*
    Yeni bir oyun/hikâye başlangıcı.
    Eski sayfa kaydını temizle.
    */

    localStorage.removeItem("sonSayfa");
    localStorage.removeItem("sonVideo");

    /*
    Maden kayıtlarını da temizle.
    Böylece yeni oyunda maden
    sıfırdan başlar.
    */

    localStorage.removeItem("madenGold");
    localStorage.removeItem("madenBroken");
    localStorage.removeItem("madenFinished");
    localStorage.removeItem("madenDestroyed");


    /*
    Index.html'yi aç.
    */

    window.location.replace(
        "index.html"
    );

}

</script>
