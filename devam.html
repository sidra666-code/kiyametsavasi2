<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Devam</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* Video kontrollerini tamamen gizle */
video::-webkit-media-controls {
    display: none !important;
}

video::-webkit-media-controls-enclosure {
    display: none !important;
}

/* Video bitince butonlar */
#buttons {
    position: fixed;
    inset: 0;

    display: none;
    align-items: center;
    justify-content: center;

    gap: 15px;

    background: rgba(0,0,0,.45);
}

/* Butonlar */
button {
    min-width: 145px;
    height: 58px;

    padding: 0 25px;

    border: none;
    border-radius: 18px;

    background: rgba(255,255,255,.15);

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow: 0 8px 30px rgba(0,0,0,.4);

    transition: .2s;
}

button:active {
    transform: scale(.94);
}

#nextBtn {
    background: linear-gradient(135deg, #22c55e, #16a34a);
}

@media (max-width: 600px) {
    button {
        min-width: 125px;
        height: 54px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<video
    id="video"
    autoplay
    playsinline
    preload="auto">

    <source src="8.mp4" type="video/mp4">

</video>

<div id="buttons">

    <button id="repeatBtn">
        ↻ TEKRARLA
    </button>

    <button id="nextBtn">
        İLERLE →
    </button>

</div>

<script>

const video = document.getElementById("video");
const buttons = document.getElementById("buttons");
const repeatBtn = document.getElementById("repeatBtn");
const nextBtn = document.getElementById("nextBtn");


/* 8.mp4'ü sesli başlat */
window.addEventListener("load", async () => {

    try {
        video.muted = false;
        video.volume = 1.0;

        await video.play();

    } catch (error) {

        console.log("Otomatik oynatma engellendi:", error);

        /*
        Eğer tarayıcı yine de sesi engellerse,
        ekrana bir kez dokunulduğunda video sesli başlar.
        */

        document.body.addEventListener("click", () => {

            video.muted = false;
            video.volume = 1.0;
            video.play();

        }, { once: true });

    }

});


/* Video bittiğinde butonları göster */
video.addEventListener("ended", () => {

    buttons.style.display = "flex";

});


/* TEKRARLA */
repeatBtn.addEventListener("click", () => {

    buttons.style.display = "none";

    video.src = "8.mp4";

    video.load();

    video.muted = false;
    video.volume = 1.0;

    video.play();

});


/* İLERLE → 9.mp4 */
nextBtn.addEventListener("click", () => {

    buttons.style.display = "none";

    video.src = "9.mp4";

    video.load();

    video.muted = false;
    video.volume = 1.0;

    video.play();

});

</script>

</body>
</html>
