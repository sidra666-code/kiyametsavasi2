<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Madencilik</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#15100c;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:#2b2119;
}


/* =====================================================
   ÜST BAR
===================================================== */

#top{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:52px;

    background:
        linear-gradient(
            #292929,
            #151515
        );

    border-bottom:2px solid #050505;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:5px 14px;

    z-index:20;
}

.logo{

    color:white;

    font-size:20px;

    font-weight:bold;
}

.stats{

    display:flex;

    gap:7px;
}

.stat{

    color:white;

    background:#303030;

    border:1px solid #505050;

    border-radius:8px;

    padding:6px 10px;

    font-size:13px;
}


/* =====================================================
   MADEN
===================================================== */

#mine{

    position:absolute;

    left:0;
    right:0;

    top:52px;
    bottom:50px;

    overflow:hidden;

    background:#302219;
}


/* =====================================================
   TOPRAK
===================================================== */

#surface{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:38px;

    background:
        repeating-linear-gradient(
            45deg,
            #624025 0px,
            #624025 8px,
            #724a2b 8px,
            #724a2b 16px
        );

    border-bottom:5px solid #392619;
}

#grass{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:8px;

    background:#4d8c32;
}


/* =====================================================
   GRID
===================================================== */

#grid{

    position:absolute;

    left:50%;
    top:38px;

    transform:translateX(-50%);

    display:grid;

    grid-template-columns:
        repeat(
            10,
            min(7.1vh,7.1vw)
        );

    grid-template-rows:
        repeat(
            6,
            min(7.1vh,7.1vw)
        );

    gap:2px;
}


/* =====================================================
   BLOKLAR
===================================================== */

.block{

    width:min(7.1vh,7.1vw);

    height:min(7.1vh,7.1vw);

    position:relative;

    overflow:hidden;

    border:
        2px solid
        rgba(0,0,0,.45);

    border-radius:3px;

    cursor:pointer;

    transition:
        transform .08s;
}

.block:active{

    transform:scale(.91);
}


/* =====================================================
   TAŞ
===================================================== */

.stone{

    background:

        radial-gradient(
            circle at 20% 30%,
            #999 3px,
            transparent 4px
        ),

        radial-gradient(
            circle at 70% 60%,
            #555 4px,
            transparent 5px
        ),

        radial-gradient(
            circle at 40% 80%,
            #777 3px,
            transparent 4px
        ),

        #626262;
}


/* =====================================================
   KÖMÜR
===================================================== */

.coal{

    background:

        radial-gradient(
            circle at 20% 25%,
            #111 6px,
            transparent 7px
        ),

        radial-gradient(
            circle at 70% 70%,
            #181818 7px,
            transparent 8px
        ),

        #686868;
}


/* =====================================================
   DEMİR
===================================================== */

.iron{

    background:

        radial-gradient(
            circle at 25% 30%,
            #bd7657 5px,
            transparent 6px
        ),

        radial-gradient(
            circle at 70% 70%,
            #a75d43 6px,
            transparent 7px
        ),

        #6b6b6b;
}


/* =====================================================
   TOPRAK
===================================================== */

.dirt{

    background:

        radial-gradient(
            circle at 20% 30%,
            #765032 2px,
            transparent 3px
        ),

        radial-gradient(
            circle at 70% 70%,
            #54351f 3px,
            transparent 4px
        ),

        #68452b;
}


/* =====================================================
   ALTIN
===================================================== */

.gold{

    background:

        radial-gradient(
            circle at 20% 25%,
            #ffe45c 6px,
            transparent 7px
        ),

        radial-gradient(
            circle at 70% 65%,
            #ffc400 7px,
            transparent 8px
        ),

        radial-gradient(
            circle at 45% 80%,
            #ffdf45 4px,
            transparent 5px
        ),

        #696969;

    box-shadow:
        inset
        0 0 14px
        rgba(255,210,0,.5);
}


/* =====================================================
   GİZLİLİK
===================================================== */

.block.hidden::before{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            135deg,
            #51483f,
            #62564c
        );

    z-index:5;

    transition:
        opacity .28s;
}

.block.reveal1::before{
    opacity:.80;
}

.block.reveal2::before{
    opacity:.55;
}

.block.reveal3::before{
    opacity:.28;
}

.block.reveal4::before{
    opacity:0;
}


/* =====================================================
   ÇATLAKLAR
===================================================== */

.crack{

    position:absolute;

    inset:0;

    z-index:8;

    opacity:0;

    pointer-events:none;
}

.crack:before{

    content:"";

    position:absolute;

    width:90%;
    height:2px;

    background:#111;

    left:5%;
    top:48%;

    transform:rotate(27deg);
}

.crack:after{

    content:"";

    position:absolute;

    width:80%;
    height:2px;

    background:#111;

    left:10%;
    top:55%;

    transform:rotate(-35deg);
}

.crack2{

    position:absolute;

    width:2px;
    height:55%;

    background:#111;

    left:49%;
    top:20%;

    transform:rotate(18deg);

    z-index:9;

    opacity:0;
}


/* =====================================================
   KAZMA
===================================================== */

.mining{

    animation:
        shake
        .09s
        infinite
        alternate;
}

@keyframes shake{

    from{
        transform:
            rotate(-1.5deg)
            scale(.98);
    }

    to{
        transform:
            rotate(1.5deg)
            scale(1);
    }
}


/* =====================================================
   KIRILMA
===================================================== */

.destroy{

    animation:
        destroy
        .3s
        forwards;
}

@keyframes destroy{

    0%{
        transform:scale(1);
        opacity:1;
    }

    100%{
        transform:scale(.1);
        opacity:0;
    }
}


/* =====================================================
   KIRILMA BAR
===================================================== */

.breakbar{

    position:absolute;

    left:8%;
    right:8%;
    bottom:7%;

    height:5px;

    background:#111;

    border-radius:5px;

    z-index:15;

    opacity:0;
}

.breakfill{

    height:100%;

    width:0%;

    background:
        linear-gradient(
            90deg,
            #ffd000,
            #ff8c00
        );

    transition:
        width .12s;
}


/* =====================================================
   ALT BAR
===================================================== */

#bottom{

    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:50px;

    background:#191919;

    border-top:
        2px solid
        #050505;

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:20;
}

#bottomContent{

    display:flex;

    align-items:center;

    gap:15px;
}

.pickaxe{

    font-size:29px;
}

.pickaxe.hit{

    transform:
        rotate(-35deg);
}

.progressArea{

    width:180px;
}

.progressText{

    color:white;

    font-size:11px;

    text-align:center;

    margin-bottom:3px;
}

.progress{

    height:8px;

    width:100%;

    background:#333;

    border-radius:10px;

    overflow:hidden;
}

.progressFill{

    height:100%;

    width:0%;

    background:
        linear-gradient(
            90deg,
            #ffd000,
            #ff8c00
        );

    transition:
        width .25s;
}


/* =====================================================
   PARÇACIK
===================================================== */

.particle{

    position:fixed;

    z-index:100;

    pointer-events:none;

    font-size:16px;

    animation:
        particle
        .5s
        forwards;
}

@keyframes particle{

    0%{

        transform:
            translate(0,0)
            scale(1);

        opacity:1;
    }

    100%{

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(.2);

        opacity:0;
    }
}


/* =====================================================
   KAZANMA EKRANI
===================================================== */

#win{

    position:absolute;

    inset:0;

    z-index:300;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    text-align:center;

    background:

        radial-gradient(
            circle,
            rgba(255,190,0,.25),
            rgba(0,0,0,.95) 65%
        );

    opacity:0;

    visibility:hidden;
}

#win.show{

    visibility:visible;

    animation:
        winFade
        .8s
        forwards;
}

@keyframes winFade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}

.winBox{

    transform:
        scale(.4);

    opacity:0;
}

#win.show .winBox{

    animation:
        winBox
        .8s
        .2s
        forwards;
}

@keyframes winBox{

    0%{

        transform:
            scale(.4)
            rotate(-8deg);

        opacity:0;
    }

    60%{

        transform:
            scale(1.12)
            rotate(2deg);

        opacity:1;
    }

    100%{

        transform:
            scale(1)
            rotate(0deg);

        opacity:1;
    }
}

.winIcon{

    font-size:75px;

    animation:
        trophy
        1s
        infinite
        alternate;
}

@keyframes trophy{

    from{

        transform:
            translateY(0)
            rotate(-5deg);
    }

    to{

        transform:
            translateY(-10px)
            rotate(5deg);
    }
}

.winTitle{

    color:#ffd000;

    font-size:38px;

    font-weight:900;

    text-shadow:
        0 0 10px #ffae00,
        0 0 25px
        rgba(255,174,0,.8);
}

.winText{

    color:white;

    font-size:18px;

    margin-top:10px;
}

.winSub{

    color:#bbb;

    font-size:13px;

    margin-top:7px;
}

#continueButton{

    margin-top:25px;

    padding:13px 38px;

    border:none;

    border-radius:12px;

    background:
        linear-gradient(
            #ffd52a,
            #e99d00
        );

    color:#171717;

    font-size:19px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 0 #986600;

    opacity:0;
}

#win.show #continueButton{

    animation:
        buttonAppear
        .5s
        1s
        forwards;
}

@keyframes buttonAppear{

    from{

        opacity:0;

        transform:
            translateY(20px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}

#continueButton:active{

    transform:
        translateY(4px);

    box-shadow:
        0 1px 0 #986600;
}


/* =====================================================
   ALTIN PARILTI
===================================================== */

.goldSpark{

    position:absolute;

    width:7px;
    height:7px;

    background:#fff3a0;

    border-radius:50%;

    pointer-events:none;

    animation:
        spark
        1s
        forwards;
}

@keyframes spark{

    0%{

        transform:scale(0);

        opacity:1;
    }

    50%{

        transform:scale(1.5);

        opacity:1;
    }

    100%{

        transform:
            scale(0)
            translateY(-30px);

        opacity:0;
    }
}


/* =====================================================
   DİKEY TELEFON
===================================================== */

#rotate{

    display:none;

    position:fixed;

    inset:0;

    z-index:999;

    background:#111;

    justify-content:center;

    align-items:center;

    text-align:center;
}

#rotate div{

    color:white;

    font-size:22px;

    line-height:1.5;
}

@media(orientation:portrait)
and (max-width:700px){

    #rotate{

        display:flex;
    }
}


/* =====================================================
   KÜÇÜK YATAY
===================================================== */

@media(max-height:400px){

    #top{
        height:43px;
    }

    #mine{
        top:43px;
        bottom:42px;
    }

    #bottom{
        height:42px;
    }

    #surface{
        height:30px;
    }

    #grid{
        top:30px;
    }

    .logo{
        font-size:16px;
    }

    .stat{
        padding:4px 7px;
        font-size:11px;
    }

    .progressArea{
        width:150px;
    }

    .pickaxe{
        font-size:25px;
    }

}

</style>

</head>


<body>


<div id="game">


    <!-- =================================================
         ÜST BAR
    ================================================= -->

    <div id="top">

        <div class="logo">
            ⛏️ MADEN
        </div>

        <div class="stats">

            <div class="stat">
                ❤️ 100
            </div>

            <div class="stat">
                ⛏️
                <span id="blocks">0</span>
            </div>

            <div class="stat">
                🪙
                <span id="gold">0</span>
            </div>

        </div>

    </div>


    <!-- =================================================
         MADEN
    ================================================= -->

    <div id="mine">

        <div id="world">

            <div id="surface">

                <div id="grass"></div>

            </div>

            <div id="grid"></div>

        </div>

    </div>


    <!-- =================================================
         ALT BAR
    ================================================= -->

    <div id="bottom">

        <div id="bottomContent">

            <div
                class="pickaxe"
                id="pickaxe">

                ⛏️

            </div>


            <div class="progressArea">

                <div class="progressText">

                    🪙 Altın:

                    <b>

                        <span id="goldText">
                            0 / 8
                        </span>

                    </b>

                </div>


                <div class="progress">

                    <div
                        id="progressFill"
                        class="progressFill">
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- =================================================
         KAZANMA
    ================================================= -->

    <div id="win">

        <div class="winBox">

            <div class="winIcon">
                🏆
            </div>

            <div class="winTitle">
                KAZANDINIZ!
            </div>

            <div class="winText">
                8 altının tamamını buldunuz!
            </div>

            <div class="winSub">
                Maceraya devam etmek için ilerleyin.
            </div>

            <button
                id="continueButton"
                onclick="continueGame()">

                İLERLE ➜

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     DİKEY TELEFON
===================================================== -->

<div id="rotate">

    <div>

        📱<br>

        Oyunu oynayabilmek için<br>

        telefonu yatay çevir.

    </div>

</div>


<script>


/* =====================================================
   KESİN HARİTA
===================================================== */

/*
6 x 10 = 60 blok

TAM OLARAK 8 ALTIN:

7
16
25
34
43
45
52
59
*/

const map = [

    "dirt",
    "dirt",
    "dirt",
    "dirt",
    "dirt",
    "dirt",
    "dirt",
    "dirt",
    "dirt",
    "dirt",

    "stone",
    "stone",
    "coal",
    "stone",
    "stone",
    "iron",
    "gold",
    "coal",
    "stone",
    "stone",

    "stone",
    "coal",
    "stone",
    "iron",
    "gold",
    "stone",
    "stone",
    "coal",
    "stone",
    "iron",

    "stone",
    "gold",
    "stone",
    "coal",
    "stone",
    "stone",
    "gold",
    "stone",
    "coal",
    "iron",

    "stone",
    "stone",
    "gold",
    "stone",
    "gold",
    "coal",
    "stone",
    "iron",
    "stone",
    "stone",

    "coal",
    "gold",
    "iron",
    "stone",
    "stone",
    "coal",
    "stone",
    "gold",
    "stone",
    "iron"

];


/* =====================================================
   SABİTLER
===================================================== */

const TOTAL_GOLD = 8;

const SAVE_KEY =
    "madenSave";


/* =====================================================
   ALTIN KONTROLÜ
===================================================== */

const goldCount =
    map.filter(
        item => item === "gold"
    ).length;


if(goldCount !== 8){

    document.body.innerHTML = `

        <div style="
            width:100vw;
            height:100vh;
            background:#111;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:Arial;
            text-align:center;
            font-size:22px;
        ">

            Harita hatası!<br>
            Altın sayısı 8 olmalı.

        </div>

    `;

    throw new Error(
        "Haritada tam 8 altın bulunmalı."
    );

}


/* =====================================================
   MADEN ÖZELLİKLERİ
===================================================== */

const resources = {

    dirt:{
        hp:2,
        emoji:"🟫"
    },

    stone:{
        hp:4,
        emoji:"🪨"
    },

    coal:{
        hp:4,
        emoji:"⚫"
    },

    iron:{
        hp:5,
        emoji:"🔩"
    },

    gold:{
        hp:7,
        emoji:"🪙"
    }

};


/* =====================================================
   ELEMENTLER
===================================================== */

const grid =
    document.getElementById(
        "grid"
    );


const blocksText =
    document.getElementById(
        "blocks"
    );


const goldText =
    document.getElementById(
        "gold"
    );


const goldProgress =
    document.getElementById(
        "goldText"
    );


const progressFill =
    document.getElementById(
        "progressFill"
    );


const win =
    document.getElementById(
        "win"
    );


/* =====================================================
   DEĞİŞKENLER
===================================================== */

let gold = 0;

let broken = 0;

let finished = false;


/*
Her bloğun mevcut HP'sini
tutacak dizi.

Örneğin:

[2,2,4,0,5...]

0 = tamamen kırılmış.
*/

let blockHP = [];


/* =====================================================
   LOCALSTORAGE
===================================================== */

/*
Kayıt oluştur.

Bu bilgiler telefonda saklanır.
*/

function saveGame(){

    try{

        const saveData = {

            gold: gold,

            broken: broken,

            blockHP: blockHP,

            finished: finished

        };


        localStorage.setItem(

            SAVE_KEY,

            JSON.stringify(
                saveData
            )

        );

    }

    catch(error){

        console.log(
            "Kayıt yapılamadı:",
            error
        );

    }

}


/* =====================================================
   KAYDI YÜKLE
===================================================== */

function loadGame(){

    try{

        const saved =
            localStorage.getItem(
                SAVE_KEY
            );


        /*
        Daha önce kayıt yoksa
        yeni oyun oluştur.
        */

        if(!saved){

            blockHP =
                map.map(
                    type =>
                        resources[type].hp
                );

            gold = 0;

            broken = 0;

            finished = false;

            return;

        }


        const data =
            JSON.parse(saved);


        /*
        Verileri geri yükle.
        */

        gold =
            Number(data.gold) || 0;


        broken =
            Number(data.broken) || 0;


        /*
        HP dizisi bozuksa
        yeni oyun oluştur.
        */

        if(

            !Array.isArray(
                data.blockHP
            ) ||

            data.blockHP.length !==
                map.length

        ){

            blockHP =
                map.map(
                    type =>
                        resources[type].hp
                );

        }

        else{

            blockHP =
                data.blockHP.map(
                    hp =>
                        Number(hp)
                );

        }


        /*
        8 altın tamamlandıysa
        kazanılmış olarak işaretle.
        */

        if(gold >= TOTAL_GOLD){

            gold = TOTAL_GOLD;

            finished = true;

        }

        else{

            finished = false;

        }

    }

    catch(error){

        console.log(
            "Kayıt okunamadı:",
            error
        );


        /*
        Kayıt bozuksa
        sıfırdan başlat.
        */

        blockHP =
            map.map(
                type =>
                    resources[type].hp
            );

        gold = 0;

        broken = 0;

        finished = false;

    }

}


/* =====================================================
   EKRANI GÜNCELLE
===================================================== */

function updateUI(){

    blocksText.textContent =
        broken;


    goldText.textContent =
        gold;


    goldProgress.textContent =
        gold +
        " / " +
        TOTAL_GOLD;


    progressFill.style.width =
        (
            gold /
            TOTAL_GOLD *
            100
        ) +
        "%";

}


/* =====================================================
   DÜNYAYI OLUŞTUR
===================================================== */

function createWorld(){

    grid.innerHTML = "";


    map.forEach(
        (type,index)=>{

            const block =
                document.createElement(
                    "div"
                );


            block.className =
                "block " +
                type +
                " hidden";


            block.dataset.type =
                type;


            /*
            Kayıttaki HP.
            */

            let hp =
                Number(
                    blockHP[index]
                );


            /*
            Geçersiz HP varsa
            maksimum HP yap.
            */

            if(
                !Number.isFinite(hp) ||
                hp < 0 ||
                hp > resources[type].hp
            ){

                hp =
                    resources[type].hp;

                blockHP[index] =
                    hp;

            }


            block.dataset.hp =
                hp;


            block.dataset.max =
                resources[type].hp;


            /* =========================================
               ÇATLAK
            ========================================= */

            const crack =
                document.createElement(
                    "div"
                );

            crack.className =
                "crack";

            block.appendChild(
                crack
            );


            /* =========================================
               İKİNCİ ÇATLAK
            ========================================= */

            const crack2 =
                document.createElement(
                    "div"
                );

            crack2.className =
                "crack2";

            block.appendChild(
                crack2
            );


            /* =========================================
               KIRILMA BAR
            ========================================= */

            const bar =
                document.createElement(
                    "div"
                );

            bar.className =
                "breakbar";


            const fill =
                document.createElement(
                    "div"
                );

            fill.className =
                "breakfill";


            bar.appendChild(
                fill
            );


            block.appendChild(
                bar
            );


            /* =========================================
               DAHA ÖNCE KIRILMIŞSA
            ========================================= */

            if(hp <= 0){

                block.classList.add(
                    "destroyed"
                );

                block.style.visibility =
                    "hidden";

            }

            else{

                /*
                Kısmen kazılmış blokları
                görsel olarak geri yükle.
                */

                const max =
                    resources[type].hp;


                const percent =
                    (
                        (max - hp) /
                        max
                    ) * 100;


                if(percent >= 15){

                    block.classList.add(
                        "reveal1"
                    );

                }

                if(percent >= 35){

                    block.classList.remove(
                        "reveal1"
                    );

                    block.classList.add(
                        "reveal2"
                    );

                }

                if(percent >= 60){

                    block.classList.remove(
                        "reveal2"
                    );

                    block.classList.add(
                        "reveal3"
                    );

                }

                if(percent >= 82){

                    block.classList.remove(
                        "reveal3"
                    );

                    block.classList.add(
                        "reveal4"
                    );

                }


                fill.style.width =
                    percent +
                    "%";


                if(percent > 0){

                    bar.style.opacity =
                        "1";

                }


                const crack =
                    block.querySelector(
                        ".crack"
                    );


                const crack2 =
                    block.querySelector(
                        ".crack2"
                    );


                crack.style.opacity =
                    Math.min(
                        1,
                        percent / 50
                    );


                crack2.style.opacity =
                    Math.max(
                        0,
                        (percent - 40) / 50
                    );

            }


            /* =========================================
               DOKUNMA
            ========================================= */

            block.addEventListener(
                "pointerdown",
                function(e){

                    e.preventDefault();

                    mine(
                        block,
                        index
                    );

                }
            );


            grid.appendChild(
                block
            );

        }
    );

}


/* =====================================================
   KAZ
===================================================== */

function mine(
    block,
    index
){

    if(finished)
        return;


    if(
        block.classList.contains(
            "destroyed"
        )
    )
        return;


    let hp =
        Number(
            block.dataset.hp
        );


    const max =
        Number(
            block.dataset.max
        );


    const type =
        block.dataset.type;


    if(hp <= 0)
        return;


    hp--;


    block.dataset.hp =
        hp;


    /*
    ÇOK ÖNEMLİ:

    Her vuruştan sonra
    LocalStorage'a kaydet.
    */

    blockHP[index] =
        hp;


    saveGame();


    block.classList.add(
        "mining"
    );


    const percent =
        (
            (max - hp) /
            max
        ) * 100;


    /* =========================================
       KIRILMA BAR
    ========================================= */

    const bar =
        block.querySelector(
            ".breakbar"
        );


    const fill =
        block.querySelector(
            ".breakfill"
        );


    bar.style.opacity =
        "1";


    fill.style.width =
        percent +
        "%";


    /* =========================================
       KAZDIKÇA GÖRÜNÜR
    ========================================= */

    if(percent >= 15){

        block.classList.add(
            "reveal1"
        );

    }


    if(percent >= 35){

        block.classList.remove(
            "reveal1"
        );

        block.classList.add(
            "reveal2"
        );

    }


    if(percent >= 60){

        block.classList.remove(
            "reveal2"
        );

        block.classList.add(
            "reveal3"
        );

    }


    if(percent >= 82){

        block.classList.remove(
            "reveal3"
        );

        block.classList.add(
            "reveal4"
        );

    }


    /* =========================================
       ÇATLAKLAR
    ========================================= */

    const crack =
        block.querySelector(
            ".crack"
        );


    const crack2 =
        block.querySelector(
            ".crack2"
        );


    crack.style.opacity =
        Math.min(
            1,
            percent / 50
        );


    crack2.style.opacity =
        Math.max(
            0,
            (percent - 40) / 50
        );


    /* =========================================
       KAZMA
    ========================================= */

    swingPickaxe();


    createParticles(
        block,
        resources[type].emoji
    );


    /* =========================================
       KIRILDI
    ========================================= */

    if(hp <= 0){

        destroyBlock(
            block,
            type,
            index
        );

    }

    else{

        setTimeout(
            ()=>{

                block.classList.remove(
                    "mining"
                );

            },
            100
        );

    }

}


/* =====================================================
   BLOK KIR
===================================================== */

function destroyBlock(
    block,
    type,
    index
){

    block.classList.remove(
        "mining"
    );


    block.classList.add(
        "destroy"
    );


    block.classList.add(
        "destroyed"
    );


    /*
    HP artık kesinlikle 0.
    */

    blockHP[index] =
        0;


    broken++;


    /* =========================================
       ALTIN
    ========================================= */

    if(type === "gold"){

        gold++;


        if(gold > TOTAL_GOLD){

            gold =
                TOTAL_GOLD;

        }

    }


    updateUI();


    /*
    KAYDET
    */

    saveGame();


    /* =========================================
       8 ALTIN TAMAMLANDI MI?
    ========================================= */

    if(gold === TOTAL_GOLD){

        victoryEffect();


        /*
        Önce kaydet.
        */

        finished = true;

        saveGame();


        setTimeout(
            showWin,
            1000
        );

    }


    /*
    Bloğu gizle.
    */

    setTimeout(
        ()=>{

            block.style.visibility =
                "hidden";

        },
        300
    );

}


/* =====================================================
   KAZMA ANİMASYONU
===================================================== */

function swingPickaxe(){

    const pickaxe =
        document.getElementById(
            "pickaxe"
        );


    pickaxe.classList.add(
        "hit"
    );


    setTimeout(
        ()=>{

            pickaxe.classList.remove(
                "hit"
            );

        },
        100
    );

}


/* =====================================================
   PARÇACIK
===================================================== */

function createParticles(
    block,
    emoji
){

    const rect =
        block.getBoundingClientRect();


    for(
        let i=0;
        i<2;
        i++
    ){

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "particle";


        particle.textContent =
            emoji;


        particle.style.left =
            (
                rect.left +
                rect.width / 2
            ) +
            "px";


        particle.style.top =
            (
                rect.top +
                rect.height / 2
            ) +
            "px";


        particle.style.setProperty(
            "--x",
            (
                Math.random()*60 -
                30
            ) +
            "px"
        );


        particle.style.setProperty(
            "--y",
            (
                Math.random()*60 -
                40
            ) +
            "px"
        );


        document.body.appendChild(
            particle
        );


        setTimeout(
            ()=>{
                particle.remove();
            },
            500
        );

    }

}


/* =====================================================
   KAZANMA PARILTILARI
===================================================== */

function victoryEffect(){

    for(
        let i=0;
        i<45;
        i++
    ){

        setTimeout(
            ()=>{

                const spark =
                    document.createElement(
                        "div"
                    );


                spark.className =
                    "goldSpark";


                spark.style.left =
                    Math.random()*100 +
                    "vw";


                spark.style.top =
                    Math.random()*100 +
                    "vh";


                document.getElementById(
                    "game"
                ).appendChild(
                    spark
                );


                setTimeout(
                    ()=>{

                        spark.remove();

                    },
                    1000
                );

            },
            i * 30
        );

    }

}


/* =====================================================
   KAZANILDI
===================================================== */

function showWin(){

    /*
    Sadece 8 altın varsa göster.
    */

    if(gold !== TOTAL_GOLD)
        return;


    win.classList.add(
        "show"
    );

}


/* =====================================================
   DEVAM ET
===================================================== */

function continueGame(){

    /*
    Önce son durumu kaydet.
    */

    saveGame();


    /*
    Aynı klasördeki
    devam.html açılır.
    */

    window.location.href =
        "devam.html";

}


/* =====================================================
   SAYFA KAPANIRKEN KAYDET
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        saveGame();

    }
);


/* =====================================================
   SAYFA ARKA PLANA GİDERKEN KAYDET
===================================================== */

document.addEventListener(
    "visibilitychange",
    function(){

        if(document.hidden){

            saveGame();

        }

    }
);


/* =====================================================
   SAYFA AÇILINCA
===================================================== */

/*
1. Önce kayıt yüklenir.
2. Dünya oluşturulur.
3. Sayaçlar güncellenir.
4. Eğer daha önce kazanıldıysa
   kazanma ekranı gösterilir.
*/

loadGame();

createWorld();

updateUI();


if(gold === TOTAL_GOLD){

    setTimeout(
        function(){

            victoryEffect();

            showWin();

        },
        500
    );

}

</script>
