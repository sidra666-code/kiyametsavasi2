<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Hikâye</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

#startScreen {

    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at center,
            #242424 0%,
            #0b0b0b 55%,
            #000 100%
        );

    z-index: 100;
}

.title {

    color: white;

    font-size:
        clamp(28px, 6vw, 70px);

    font-weight: 700;

    letter-spacing: 6px;

    margin-bottom: 40px;

    text-shadow:
        0 0 20px rgba(255,255,255,.2);
}

.startButton {

    padding: 18px 45px;

    border-radius: 14px;

    border:
        1px solid rgba(255,255,255,.3);

    background:
        rgba(255,255,255,.08);

    color: white;

    font-size: 18px;

    font-weight: bold;

    letter-spacing: 2px;

    cursor: pointer;

    backdrop-filter: blur(15px);

    transition: .25s;
}

.startButton:hover {

    transform: scale(1.05);

    background:
        rgba(255,255,255,.15);
}

.startButton:active {

    transform: scale(.96);
}

#game {

    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    display: none;

    z-index: 10;
}

#video {

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    display: block;

    outline: none;
}

#endScreen {

    position: absolute;
    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    background:
        rgba(0,0,0,.45);

    backdrop-filter: blur(4px);

    z-index: 30;
}

.endTitle {

    color: white;

    font-size:
        clamp(20px, 4vw, 42px);

    font-weight: bold;

    text-align: center;

    margin-bottom: 35px;

    padding: 0 20px;

    text-shadow:
        0 0 20px #000;
}

.buttons {

    display: flex;

    gap: 25px;

    justify-content: center;
    align-items: flex-start;

    flex-wrap: wrap;
}

.actionWrapper {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;
}

.actionButton {

    min-width: 190px;

    min-height: 65px;

    padding: 16px 25px;

    border-radius: 10px;

    border:
        1px solid rgba(255,255,255,.25);

    color: white;

    background:
        rgba(255,255,255,.10);

    backdrop-filter: blur(15px);

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 1px;

    cursor: pointer;

    opacity: .45;

    transition: .25s;
}

.actionButton.active {

    opacity: 1;

    background:
        rgba(255,255,255,.18);

    transform: scale(1.02);
}

.actionButton.active:active {

    transform: scale(.95);
}

.timerBar {

    width: 190px;

    height: 4px;

    background:
        rgba(255,255,255,.18);

    border-radius: 10px;

    overflow: hidden;
}

.timerFill {

    width: 0%;

    height: 100%;

    background: white;

    border-radius: 10px;
}

.timerFill.counting {

    animation:
        fillTimer 10s linear forwards;
}

@keyframes fillTimer {

    from {
        width: 0%;
    }

    to {
        width: 100%;
    }
}

#rotateMessage {

    position: fixed;

    inset: 0;

    background: #000;

    color: white;

    display: none;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    text-align: center;

    z-index: 9999;

    padding: 30px;
}

.phoneIcon {

    font-size: 50px;

    margin-bottom: 20px;

    animation:
        rotatePhone 1.5s infinite;
}

@keyframes rotatePhone {

    0% {
        transform: rotate(0deg);
    }

    50% {
        transform: rotate(90deg);
    }

    100% {
        transform: rotate(90deg);
    }
}

@media (orientation: portrait) {

    #rotateMessage {
        display: flex;
    }
}

@media (orientation: landscape) {

    #rotateMessage {
        display: none;
    }
}

@media (max-width: 700px) {

    .title {

        font-size: 28px;

        margin-bottom: 25px;
    }

    .startButton {

        padding: 15px 30px;

        font-size: 15px;
    }

    .endTitle {

        font-size: 21px;

        margin-bottom: 20px;
    }

    .buttons {

        gap: 12px;
    }

    .actionButton {

        min-width: 150px;

        min-height: 55px;

        padding: 12px 15px;

        font-size: 12px;
    }

    .timerBar {

        width: 150px;

        height: 4px;
    }

}

</style>

</head>


<body>


<div id="rotateMessage">

    <div class="phoneIcon">
        📱
    </div>

    <h2>
        Telefonu Yatay Çevir
    </h2>

    <p style="margin-top:10px; opacity:.7;">
        Hikâyeyi oynamak için telefonu yatay kullan.
    </p>

</div>



<div id="startScreen">

    <div class="title">
        HİKÂYEN
    </div>

    <button
        class="startButton"
        id="startButton">

        ▶ HİKÂYEYE BAŞLA

    </button>

</div>



<div id="game">

    <video
        id="video"
        playsinline
        webkit-playsinline
        preload="auto"
        controlslist="nodownload nofullscreen noremoteplayback"
        disablepictureinpicture>
    </video>


    <div id="endScreen">

        <div
            class="endTitle"
            id="endTitle">

            Sahne tamamlandı

        </div>


        <div class="buttons">


            <div class="actionWrapper">

                <button
                    class="actionButton"
                    id="repeatButton"
                    disabled>

                    🔁 TEKRARLA

                </button>

                <div class="timerBar">

                    <div
                        class="timerFill"
                        id="repeatTimer">
                    </div>

                </div>

            </div>



            <div class="actionWrapper">

                <button
                    class="actionButton"
                    id="nextButton"
                    disabled>

                    ➡ İLERLE

                </button>

                <div class="timerBar">

                    <div
                        class="timerFill"
                        id="nextTimer">
                    </div>

                </div>

            </div>


        </div>

    </div>

</div>



<script>

/* =====================================================
   AYARLAR
===================================================== */

const totalVideos = 7;


/* =====================================================
   BUTON YAZILARI
===================================================== */

const nextTexts = {

    1: "İLERLE",

    2: "GEÇ",

    3: "DAĞA ÇIK",

    4: "KÖYE GİT",

    5: "İLERLE",

    6: "MADENCİLİK YAP",

    7: "YARDIM ET"

};


/* =====================================================
   LOCALSTORAGE
===================================================== */

/*
    Oyuncunun kaldığı video burada tutulur.

    Örnek:

    5 = 5.mp4
    6 = 6.mp4
    7 = 7.mp4
*/

const SAVE_KEY =
    "hikaye_current_video";


/*
    Eğer daha önce kayıt varsa
    kayıtlı videoyu al.

    Yoksa 1. videodan başla.
*/

let savedVideo =
    parseInt(
        localStorage.getItem(
            SAVE_KEY
        )
    );


if (
    isNaN(savedVideo) ||
    savedVideo < 1 ||
    savedVideo > totalVideos
) {

    savedVideo = 1;

}


/* =====================================================
   ELEMENTLER
===================================================== */

const startScreen =
    document.getElementById(
        "startScreen"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const game =
    document.getElementById(
        "game"
    );


const video =
    document.getElementById(
        "video"
    );


const endScreen =
    document.getElementById(
        "endScreen"
    );


const endTitle =
    document.getElementById(
        "endTitle"
    );


const repeatButton =
    document.getElementById(
        "repeatButton"
    );


const nextButton =
    document.getElementById(
        "nextButton"
    );


const repeatTimer =
    document.getElementById(
        "repeatTimer"
    );


const nextTimer =
    document.getElementById(
        "nextTimer"
    );


/* =====================================================
   DEĞİŞKENLER
===================================================== */

let currentVideo =
    savedVideo;

let buttonsLocked =
    true;

let timerID =
    null;


/* =====================================================
   KAYDET
===================================================== */

function saveProgress(number) {

    localStorage.setItem(
        SAVE_KEY,
        String(number)
    );

}


/* =====================================================
   VİDEO YÜKLE
===================================================== */

function loadVideo(number) {

    /*
        7'den daha ileri video yok.
    */

    if (
        number < 1 ||
        number > totalVideos
    ) {

        return;

    }


    currentVideo =
        number;


    /*
        İLERLEMEYİ HEMEN KAYDET
    */

    saveProgress(
        number
    );


    /*
        Bitiş ekranını kapat
    */

    endScreen.style.display =
        "none";


    /*
        Timer temizle
    */

    if (timerID) {

        clearTimeout(
            timerID
        );

        timerID = null;

    }


    /*
        Videoyu yükle
    */

    video.src =
        number + ".mp4";

    video.load();


    /*
        Oynat
    */

    video.play().catch(
        function(error) {

            console.log(
                "Video başlatılamadı:",
                error
            );

        }
    );

}


/* =====================================================
   BUTONLARI KİLİTLE
===================================================== */

function lockButtons() {

    buttonsLocked =
        true;


    repeatButton.disabled =
        true;

    nextButton.disabled =
        true;


    repeatButton.classList.remove(
        "active"
    );

    nextButton.classList.remove(
        "active"
    );


    repeatTimer.classList.remove(
        "counting"
    );

    nextTimer.classList.remove(
        "counting"
    );


    repeatTimer.style.width =
        "0%";

    nextTimer.style.width =
        "0%";


    void repeatTimer.offsetWidth;

    void nextTimer.offsetWidth;


    repeatTimer.classList.add(
        "counting"
    );

    nextTimer.classList.add(
        "counting"
    );


    timerID =
        setTimeout(
            function() {

                unlockButtons();

            },
            10000
        );

}


/* =====================================================
   BUTONLARI AÇ
===================================================== */

function unlockButtons() {

    buttonsLocked =
        false;


    repeatButton.disabled =
        false;

    nextButton.disabled =
        false;


    repeatButton.classList.add(
        "active"
    );

    nextButton.classList.add(
        "active"
    );


    repeatTimer.classList.remove(
        "counting"
    );

    nextTimer.classList.remove(
        "counting"
    );


    repeatTimer.style.width =
        "100%";

    nextTimer.style.width =
        "100%";

}


/* =====================================================
   BAŞLAT
===================================================== */

startButton.addEventListener(
    "click",
    async function() {


        startScreen.style.display =
            "none";


        game.style.display =
            "block";


        try {

            if (
                document
                    .documentElement
                    .requestFullscreen
            ) {

                await document
                    .documentElement
                    .requestFullscreen();

            }

        }

        catch(error) {

            console.log(
                "Tam ekran açılamadı."
            );

        }


        /*
            KAYITLI YERDEN BAŞLA
        */

        loadVideo(
            savedVideo
        );

    }
);


/* =====================================================
   VİDEO BİTTİ
===================================================== */

video.addEventListener(
    "ended",
    function() {


        video.pause();


        endScreen.style.display =
            "flex";


        endTitle.textContent =
            "Sahne " +
            currentVideo +
            " tamamlandı";


        repeatButton.textContent =
            "🔁 TEKRARLA";


        /*
            6. video:

            TEKRARLA
            MADENCİLİK YAP

        */

        if (
            currentVideo === 6
        ) {

            nextButton.textContent =
                "⛏️ MADENCİLİK YAP";

        }


        /*
            7. video:

            TEKRARLA
            YARDIM ET
        */

        else if (
            currentVideo === 7
        ) {

            nextButton.textContent =
                "🆘 YARDIM ET";

        }


        /*
            Diğer videolar
        */

        else {

            nextButton.textContent =
                "➡ " +
                (
                    nextTexts[currentVideo]
                    ||
                    "İLERLE"
                );

        }


        lockButtons();

    }
);


/* =====================================================
   TEKRARLA
===================================================== */

repeatButton.addEventListener(
    "click",
    function() {


        if (
            buttonsLocked
        ) {

            return;

        }


        endScreen.style.display =
            "none";


        video.currentTime =
            0;


        video.play().catch(
            function() {}
        );

    }
);


/* =====================================================
   İLERLE / ÖZEL BUTON
===================================================== */

nextButton.addEventListener(
    "click",
    function() {


        if (
            buttonsLocked
        ) {

            return;

        }


        /*
        =================================================
        6. VİDEO SONU
        =================================================

        MADENCİLİK YAP
        → maden.html
        */

        if (
            currentVideo === 6
        ) {

            /*
                7. bölüme geçileceğini kaydet.
            */

            saveProgress(7);


            /*
                Madencilik ekranını aç.
            */

            window.location.href =
                "maden.html";

            return;

        }


        /*
        =================================================
        7. VİDEO SONU
        =================================================

        YARDIM ET
        → yardim.html
        */

        if (
            currentVideo === 7
        ) {

            /*
                BURADAKİ DOSYA ADINI
                KENDİ DOSYA ADINLA DEĞİŞTİR.
            */

            window.location.href =
                "yardim.html";

            return;

        }


        /*
        =================================================
        NORMAL SONRAKİ VİDEO
        =================================================
        */

        const nextVideo =
            currentVideo + 1;


        if (
            nextVideo <= totalVideos
        ) {

            saveProgress(
                nextVideo
            );

            loadVideo(
                nextVideo
            );

        }

    }
);


/* =====================================================
   VİDEO KONTROLLERİNİ ENGELLE
===================================================== */

video.controls =
    false;


video.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    }
);


video.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

    }
);


/* =====================================================
   KLAVYE
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.code === "Space"
        ) {

            event.preventDefault();

        }


        if (

            event.code === "ArrowLeft" ||

            event.code === "ArrowRight" ||

            event.code === "ArrowUp" ||

            event.code === "ArrowDown"

        ) {

            event.preventDefault();

        }

    }
);


/* =====================================================
   VİDEO DURURSA
===================================================== */

video.addEventListener(
    "pause",
    function() {


        if (

            !video.ended &&

            game.style.display !==
                "none" &&

            endScreen.style.display !==
                "flex"

        ) {

            video.play().catch(
                function() {}
            );

        }

    }
);


/* =====================================================
   SAYFAYA GERİ DÖNÜŞ
===================================================== */

document.addEventListener(
    "visibilitychange",
    function() {


        if (

            !document.hidden &&

            game.style.display !==
                "none" &&

            !video.ended &&

            endScreen.style.display !==
                "flex"

        ) {

            video.play().catch(
                function() {}
            );

        }

    }
);

</script>

</body>

</html>
